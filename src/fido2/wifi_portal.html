<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico FIDO2</title>
<style>
:root{color-scheme:dark;font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0e10;color:#e9eaec}
*{box-sizing:border-box}body{margin:0}.shell{width:min(720px,100%);margin:0 auto;padding:18px 14px 28px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}.title{font-size:22px;font-weight:650;letter-spacing:-.02em}.sub{color:#92979f;font-size:12px;margin-top:2px}.statusbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.pill{border:1px solid #33373d;border-radius:999px;padding:4px 8px;color:#b7bbc2;background:#17191d;font-size:12px;white-space:nowrap}.pill.ok{color:#9fe3ae;border-color:#295d35}.pill.warn{color:#ffd58c;border-color:#6b5425}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#15171a;border:1px solid #2a2d32;border-radius:10px;padding:12px 13px;min-width:0}.wide{grid-column:1/-1}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.head h2{font-size:14px;margin:0;font-weight:650}.hint,.feedback{color:#92979f;font-size:12px}.feedback{min-height:17px;margin-top:8px}.feedback.ok{color:#8fdba1}.feedback.bad{color:#ff9999}.rows{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}.rows dt{color:#858a92}.rows dd{margin:0;text-align:right;overflow-wrap:anywhere}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.app{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid #30343a;border-radius:7px;background:#1b1e22;white-space:nowrap}.app input{margin:0}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:10px}button,.filebtn,input[type=text]{font:inherit;border:1px solid #3b4048;border-radius:7px;background:#23262b;color:#f0f1f2;padding:7px 10px}button,.filebtn{cursor:pointer;font-weight:550}button:hover,.filebtn:hover{background:#2a2e34}button:disabled{opacity:.55;cursor:default}.primary{background:#e6e8eb;color:#121315;border-color:#e6e8eb}.primary:hover{background:#fff}.danger{color:#ffaaaa;border-color:#6e3737;background:#251919}.danger:hover{background:#321d1d}.field{display:grid;gap:4px;margin-top:8px}.field label{color:#92979f;font-size:12px}.field input{width:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{display:flex;align-items:center;gap:8px;min-width:0}.file input{display:none}.filename{color:#aeb3ba;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dangerzone{border-color:#4b2d2d}.hidden{display:none!important}@media(max-width:620px){.top{display:block}.statusbar{justify-content:flex-start;margin-top:8px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.inline{grid-template-columns:1fr}.rows dd{text-align:left}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="title">Pico FIDO2</div><div class="sub" id="subtitle">Maintenance session</div></div><div class="statusbar"><span class="pill" id="sbPill">Secure Boot</span><span class="pill" id="fePill">Flash Encryption</span><span class="pill" id="slotPill">OTA</span></div></header>
<section class="grid">
<article class="card"><div class="head"><h2>Device</h2><span class="hint" id="timeoutLabel"></span></div><dl class="rows"><dt>Firmware</dt><dd id="fwVersion">—</dd><dt>Platform</dt><dd id="platform">—</dd><dt>Wi-Fi</dt><dd id="ssid">—</dd><dt>BLE</dt><dd id="bleState">—</dd><dt>Recovery</dt><dd id="recovery">—</dd></dl></article>
<article class="card"><div class="head"><h2>Firmware update</h2><span class="hint" id="otaSummary">—</span></div><div class="file"><label class="filebtn" for="firmware">Choose signed .bin</label><input id="firmware" type="file" accept=".bin,application/octet-stream"><span class="filename" id="filename">No file selected</span></div><div class="actions"><button class="primary" id="updateButton">Install update</button></div><div class="feedback" id="otaFeedback"></div></article>
<article class="card wide"><div class="head"><h2>USB applications</h2><span class="hint">Applied after restart</span></div><div class="apps" id="apps"></div><div class="actions"><button class="primary" id="saveButton">Save configuration</button></div><div class="feedback" id="appsFeedback"></div></article>
<article class="card"><div class="head"><h2>Configuration lock</h2><span class="hint" id="lockState">—</span></div><div class="inline"><div class="field"><label for="newLock">New lock code</label><input id="newLock" type="text" maxlength="32" autocomplete="off" placeholder="32 hex characters"></div><div class="field"><label for="confirmLock">Confirm</label><input id="confirmLock" type="text" maxlength="32" autocomplete="off" placeholder="Repeat code"></div></div><div class="actions"><button id="setLockButton">Set / change</button><button class="danger hidden" id="clearLockButton">Clear lock</button></div><div class="feedback" id="lockFeedback"></div></article>
<article class="card"><div class="head"><h2>Bluetooth</h2><span class="hint" id="bleHint">—</span></div><div class="actions" id="bleActions"><button id="pairButton">Open pairing window</button></div><div class="feedback" id="bleFeedback"></div></article>
<article class="card wide dangerzone"><div class="head"><h2>Maintenance</h2><span class="hint">Session-scoped actions</span></div><div class="actions"><button id="rebootButton">Restart device</button><button class="danger" id="resetBondsButton">Reset all BLE bonds…</button></div><div class="feedback" id="maintenanceFeedback"></div></article>
</section>
</main>
<script>
const caps=[['OTP',1],['U2F',2],['OpenPGP',8],['PIV',16],['OATH',32],['HSM Auth',256],['FIDO2',512],['Management',1024]];let cfg=null,state=null;const $=id=>document.getElementById(id);
function feedback(id,text,kind=''){const e=$(id);e.textContent=text;e.className='feedback'+(kind?' '+kind:'')}
function pill(id,on,label){const e=$(id);e.textContent=label;e.className='pill '+(on?'ok':'warn')}
async function json(r){try{return await r.json()}catch{return {error:`HTTP ${r.status}`}}}
async function busy(button,label,work){const old=button.textContent;button.disabled=true;button.textContent=label;try{return await work()}finally{button.disabled=false;button.textContent=old}}
function render(){const sec=state.security||{},ota=state.ota||{},version=state.firmware?.projectVersion||cfg.projectVersion||state.version||'';$('subtitle').textContent=`${state.device||'Pico FIDO2'} · ${version}`;pill('sbPill',!!sec.secureBoot,sec.secureBoot?'Secure Boot on':'Secure Boot off');pill('fePill',!!sec.flashEncryption,sec.flashEncryption?'Flash Encryption on':'Flash Encryption off');$('slotPill').textContent=ota.enabled?`${ota.runningPartition||'OTA'}${ota.confirmationPending?' · pending':' · valid'}`:'OTA disabled';$('slotPill').className='pill '+(ota.enabled&&!ota.confirmationPending?'ok':'warn');$('timeoutLabel').textContent=`${Math.round((state.idleTimeoutSec||0)/60)} min idle timeout`;$('fwVersion').textContent=version||'—';$('platform').textContent=state.platform||'—';$('ssid').textContent=state.ssid||'—';$('bleState').textContent=state.bleSupported?(state.ble?'Running':'Paused for maintenance'):'Not supported';$('recovery').textContent=(sec.romDownload&&sec.usbSerialJtagDownload)?'ROM + USB enabled':'Restricted';$('otaSummary').textContent=ota.enabled?`${ota.runningPartition||'—'} → ${ota.nextPartition||'—'}`:'Disabled';$('updateButton').disabled=!ota.ready;if(ota.enabled)feedback('otaFeedback',ota.ready?`Ready. Security epoch ${ota.securityVersion}.`:(ota.confirmationPending?'Current image is awaiting rollback confirmation.':'Secure A/B update is not ready.'));$('apps').innerHTML='';for(const [name,bit] of caps){const label=document.createElement('label');label.className='app';const input=document.createElement('input');input.type='checkbox';input.dataset.bit=bit;input.checked=!!(cfg.enabled&bit);input.disabled=!(cfg.supported&bit);label.append(input,document.createTextNode(name));$('apps').append(label)}$('lockState').textContent=cfg.locked?'Locked':'Unlocked';$('clearLockButton').classList.toggle('hidden',!cfg.locked);$('bleActions').classList.toggle('hidden',!state.bleSupported);$('resetBondsButton').classList.toggle('hidden',!state.bleSupported);$('bleHint').textContent=state.bleSupported?'Pairing is physical-session gated':'Not supported'}
async function load(){const [sr,cr]=await Promise.all([fetch('/api/status',{cache:'no-store'}),fetch('/api/config',{cache:'no-store'})]);if(!sr.ok||!cr.ok)throw new Error('Device status unavailable');state=await sr.json();cfg=await cr.json();render()}
$('firmware').addEventListener('change',()=>{const f=$('firmware').files[0];$('filename').textContent=f?`${f.name} · ${(f.size/1048576).toFixed(2)} MiB`:'No file selected'});
$('saveButton').addEventListener('click',()=>busy($('saveButton'),'Saving…',async()=>{let enabled=0;for(const x of $('apps').querySelectorAll('input'))if(x.checked)enabled|=+x.dataset.bit;if(!(enabled&(1|2|512|1024))){feedback('appsFeedback','Keep at least one management-capable USB transport enabled.','bad');return}feedback('appsFeedback','Saving configuration…');const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Pico-CSRF':cfg.csrf},body:new URLSearchParams({enabled:String(enabled)})});const j=await json(r);if(!r.ok){feedback('appsFeedback',j.error||'Save failed.','bad');return}await load();feedback('appsFeedback','Saved. Restart to apply USB interface changes.','ok')}));
async function changeLock(clear){const body=new URLSearchParams();if(clear){if(!confirm('Clear the USB configuration lock?'))return;body.set('clear','1')}else{const n=$('newLock').value.trim(),c=$('confirmLock').value.trim();if(!/^[0-9a-fA-F]{32}$/.test(n)||/^0+$/.test(n)){feedback('lockFeedback','Lock code must be 32 non-zero hexadecimal characters.','bad');return}if(n.toLowerCase()!==c.toLowerCase()){feedback('lockFeedback','Confirmation does not match.','bad');return}body.set('new',n)}feedback('lockFeedback',clear?'Clearing lock…':'Saving lock…');const r=await fetch('/api/config/lock',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Pico-CSRF':cfg.csrf},body});const j=await json(r);if(!r.ok){feedback('lockFeedback',j.error||'Lock update failed.','bad');return}$('newLock').value='';$('confirmLock').value='';await load();feedback('lockFeedback',clear?'Configuration lock cleared.':'Configuration lock saved.','ok')}
$('setLockButton').addEventListener('click',()=>busy($('setLockButton'),'Saving…',()=>changeLock(false)));$('clearLockButton').addEventListener('click',()=>busy($('clearLockButton'),'Clearing…',()=>changeLock(true)));
$('pairButton').addEventListener('click',()=>busy($('pairButton'),'Authorizing…',async()=>{feedback('bleFeedback','Scheduling one pairing window…');const r=await fetch('/api/ble/pairing',{method:'POST',headers:{'X-Pico-CSRF':cfg.csrf}});const j=await json(r);feedback('bleFeedback',r.ok?'Pairing window authorized. Device is restarting.':(j.error||'Pairing authorization failed.'),r.ok?'ok':'bad')}));
$('resetBondsButton').addEventListener('click',()=>busy($('resetBondsButton'),'Resetting…',async()=>{if(!confirm('Revoke every persisted BLE bond? Existing paired devices will lose trust.'))return;feedback('maintenanceFeedback','Scheduling BLE bond reset…');const r=await fetch('/api/ble/bonds/reset',{method:'POST',headers:{'X-Pico-CSRF':cfg.csrf}});const j=await json(r);feedback('maintenanceFeedback',r.ok?'BLE bonds will be reset; device is restarting into one fresh pairing window.':(j.error||'BLE bond reset failed.'),r.ok?'ok':'bad')}));
$('rebootButton').addEventListener('click',()=>busy($('rebootButton'),'Restarting…',async()=>{feedback('maintenanceFeedback','Restart requested…');const r=await fetch('/api/reboot',{method:'POST',headers:{'X-Pico-CSRF':cfg.csrf}});feedback('maintenanceFeedback',r.ok?'Device is restarting.':'Restart request failed.',r.ok?'ok':'bad')}));
$('updateButton').addEventListener('click',()=>busy($('updateButton'),'Uploading…',async()=>{const f=$('firmware').files[0];if(!f){feedback('otaFeedback','Choose a signed application .bin first.','bad');return}if(!confirm(`Install ${f.name} (${f.size} bytes) into the inactive slot?`))return;feedback('otaFeedback','Uploading and verifying signed firmware…');try{const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Pico-CSRF':cfg.csrf},body:f});if(!r.ok){const j=await json(r);feedback('otaFeedback',j.error||'Update rejected.','bad');return}const v=r.headers.get('X-Pico-Version')||'new image',p=r.headers.get('X-Pico-Partition')||'inactive slot',e=r.headers.get('X-Pico-Security-Version')||'?';feedback('otaFeedback',`Verified ${v}, epoch ${e}, in ${p}. Device is restarting.`,'ok')}catch(e){feedback('otaFeedback',String(e),'bad')}}));
load().catch(e=>feedback('maintenanceFeedback',String(e),'bad'));
</script>
</body>
</html>
